<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDX BOT • AHMII PREMIUM</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #0a0e1a;
            padding: 40px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 150, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 100, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(0, 200, 255, 0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        .AHMII-card {
            max-width: 1000px;
            width: 100%;
            background: linear-gradient(135deg, #0d1425 0%, #0a0f1a 100%);
            border-radius: 60px;
            padding: 50px 60px;
            border: 2px solid #00d4ff;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.9),
                0 0 0 3px #0a0e1a,
                0 0 0 6px rgba(0, 212, 255, 0.3),
                0 0 100px rgba(0, 212, 255, 0.2),
                inset 0 0 60px rgba(0, 212, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .AHMII-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            height: 8px;
            background: linear-gradient(90deg, 
                #00d4ff, #0099ff, #0066ff, #0099ff, #00d4ff);
            background-size: 200% 100%;
            animation: AHMIIFlow 3s linear infinite;
            border-radius: 60px 60px 0 0;
        }

        @keyframes AHMIIFlow {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        .AHMII-card::after {
            content: '◈';
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-size: 100px;
            color: rgba(0, 212, 255, 0.03);
            pointer-events: none;
        }

        /* Logo Section */
        .logo-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 85px;
            height: 85px;
            background: linear-gradient(135deg, #00d4ff, #0099ff, #0066ff);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 20px 40px rgba(0, 212, 255, 0.4),
                0 0 30px rgba(0, 153, 255, 0.3);
            border: 2px solid #00d4ff;
        }

        .logo-icon i {
            font-size: 48px;
            color: #ffffff;
            filter: drop-shadow(0 0 15px #00d4ff);
        }

        .logo-text h1 {
            font-size: 52px;
            font-weight: 900;
            color: #00d4ff;
            letter-spacing: -1px;
            text-shadow: 0 0 40px rgba(0, 212, 255, 0.5);
        }

        .logo-text h1 span {
            color: #ffffff;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .logo-text p {
            color: #0099ff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-top: 5px;
            text-shadow: 0 0 20px rgba(0, 153, 255, 0.5);
        }

        .diamond-badge {
            margin-left: auto;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(0, 153, 255, 0.1));
            border: 2px solid #00d4ff;
            padding: 12px 25px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
        }

        .diamond-icon {
            color: #00d4ff;
            font-size: 24px;
            filter: drop-shadow(0 0 15px #00d4ff);
            animation: diamondPulse 2s infinite;
        }

        @keyframes diamondPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        .diamond-badge span {
            color: #00d4ff;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Owner Card */
        .owner-card {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.08), rgba(0, 153, 255, 0.05));
            border: 2px solid #00d4ff;
            border-radius: 40px;
            padding: 35px 40px;
            display: flex;
            align-items: center;
            gap: 35px;
            margin-bottom: 40px;
            box-shadow: 
                inset 0 0 40px rgba(0, 212, 255, 0.05),
                0 15px 30px rgba(0, 0, 0, 0.5);
        }

        .owner-avatar {
            width: 130px;
            height: 130px;
            background: linear-gradient(135deg, #00d4ff, #0099ff, #0066ff);
            border-radius: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 25px 40px rgba(0, 212, 255, 0.4),
                0 0 50px rgba(0, 153, 255, 0.3);
            border: 3px solid #00d4ff;
        }

        .owner-avatar i {
            font-size: 65px;
            color: #ffffff;
            filter: drop-shadow(0 0 15px #00d4ff);
        }

        .owner-details h2 {
            font-size: 46px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 0 40px rgba(0, 212, 255, 0.4);
        }

        .brand-tag {
            display: inline-block;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            padding: 10px 30px;
            border-radius: 50px;
            margin-bottom: 15px;
            border: 2px solid #ffffff;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.5);
        }

        .brand-tag span {
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 5px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .owner-location {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #00d4ff;
            font-size: 22px;
            font-weight: 600;
        }

        .owner-location i {
            color: #ff6b6b;
            font-size: 24px;
            filter: drop-shadow(0 0 10px #ff6b6b);
        }

        /* Stats Container */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
            margin-bottom: 40px;
        }

        .stat-item {
            background: linear-gradient(135deg, #0d1425, #0a0f1a);
            border-radius: 30px;
            padding: 35px 20px;
            text-align: center;
            border: 2px solid #00d4ff;
            transition: all 0.3s;
            box-shadow: inset 0 0 30px rgba(0, 212, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .stat-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(0, 212, 255, 0.1), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .stat-item:hover::before {
            opacity: 1;
        }

        .stat-item:hover {
            transform: translateY(-8px);
            border-color: #0099ff;
            box-shadow: 
                0 25px 40px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(0, 212, 255, 0.4);
        }

        .stat-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.5);
            border: 2px solid #00d4ff;
        }

        .stat-icon i {
            font-size: 32px;
            color: #ffffff;
        }

        .stat-value {
            font-size: 40px;
            font-weight: 900;
            color: #00d4ff;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.6);
        }

        .stat-label {
            color: #0099ff;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 25px;
            margin-bottom: 40px;
        }

        .btn {
            flex: 1;
            padding: 24px 35px;
            border-radius: 60px;
            font-size: 22px;
            font-weight: 800;
            text-decoration: none;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            transition: all 0.3s;
            border: 3px solid;
            position: relative;
            overflow: hidden;
        }

        .btn i {
            font-size: 28px;
        }

        .btn-AHMII {
            background: linear-gradient(135deg, #00d4ff, #0099ff, #0066ff);
            border-color: #00d4ff;
            color: #ffffff;
            box-shadow: 0 15px 40px rgba(0, 212, 255, 0.5);
        }

        .btn-AHMII:hover {
            background: transparent;
            color: #00d4ff;
            box-shadow: 0 20px 50px rgba(0, 212, 255, 0.7);
            transform: scale(1.03);
        }

        .btn-outline {
            background: transparent;
            border-color: #00d4ff;
            color: #00d4ff;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
        }

        .btn-outline:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: #0099ff;
            color: #0099ff;
            box-shadow: 0 20px 50px rgba(0, 212, 255, 0.4);
        }

        /* Footer */
        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 35px;
            border-top: 2px solid #00d4ff;
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .footer-left i {
            color: #00d4ff;
            font-size: 22px;
            filter: drop-shadow(0 0 10px #00d4ff);
        }

        .footer-left span {
            color: #0099ff;
            font-weight: 700;
            letter-spacing: 3px;
            font-size: 15px;
        }

        .footer-center {
            color: #00d4ff;
            font-weight: 800;
            font-size: 20px;
            text-shadow: 0 0 30px #00d4ff;
            letter-spacing: 4px;
        }

        .footer-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .footer-right i {
            color: #ff4444;
            font-size: 24px;
            filter: drop-shadow(0 0 15px #ff4444);
            animation: AHMIIHeart 1.5s infinite;
        }

        @keyframes AHMIIHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .footer-right span {
            color: #00d4ff;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 2px;
        }

        /* Sparkle Effect */
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00d4ff;
            border-radius: 50%;
            box-shadow: 0 0 20px #00d4ff;
            animation: sparkleFloat 4s infinite;
        }

        @keyframes sparkleFloat {
            0%, 100% { opacity: 0; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-20px); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            body { padding: 20px; }
            .AHMII-card { padding: 35px 25px; }
            .logo-section { flex-wrap: wrap; }
            .diamond-badge { margin-left: 0; width: 100%; justify-content: center; }
            .owner-card { flex-direction: column; text-align: center; }
            .stats-container { grid-template-columns: 1fr 1fr; }
            .action-buttons { flex-direction: column; }
            .footer { flex-direction: column; gap: 20px; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="AHMII-card">
        
        <!-- Sparkles -->
        <div class="sparkle" style="top: 20%; left: 10%; animation-delay: 0s;"></div>
        <div class="sparkle" style="top: 60%; left: 5%; animation-delay: 1s;"></div>
        <div class="sparkle" style="top: 30%; right: 8%; animation-delay: 2s;"></div>
        <div class="sparkle" style="top: 70%; right: 15%; animation-delay: 0.5s;"></div>

        <!-- Logo Section -->
        <div class="logo-section">
            <div class="logo-icon">
                <i class="fas fa-robot"></i>
            </div>
            <div class="logo-text">
                <h1><span>RDX</span> BOT</h1>
                <p>AHMII PREMIUM</p>
            </div>
            <div class="diamond-badge">

            </div>

        <!-- Owner Card -->
        <div class="owner-card">
            <div class="owner-avatar">

            </div>
            <div class="owner-details">
                <h2>Ahmad Ali Safdar</h2>

                    <span>💎 AHMAD RDX 💎</span>
                </div>
                <div class="owner-location">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>Toba Tek Singh, Pakistan</span>
                </div>
            </div>
        </div>

        <!-- Stats Container -->
        <div class="stats-container">
            <div class="stat-item">
                <div class="stat-icon">
                    <i class="fas fa-code-branch"></i>
                </div>
                <div class="stat-value">3.0.0</div>
                <div class="stat-label">VERSION</div>
            </div>
            <div class="stat-item">
                <div class="stat-icon">
                    <i class="fas fa-terminal"></i>
                </div>
                <div class="stat-value">.</div>
                <div class="stat-label">PREFIX</div>
            </div>
            <div class="stat-item">
                <div class="stat-icon">
                    <i class="fas fa-cloud"></i>
                </div>
                <div class="stat-value">BOT</div>
                <div class="stat-label">HOST</div>
            </div>
            <div class="stat-item">
                <div class="stat-icon">
                    <i class="fas fa-microchip"></i>
                </div>
                <div class="stat-value">RDX v3</div>
                <div class="stat-label">ENGINE</div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <a href="/" class="btn btn-AHMII">
                <i class="fas fa-chart-pie"></i>
                DASHBOARD
            </a>
            <a href="/api/status" class="btn btn-outline">
                <i class="fas fa-plug"></i>
                API STATUS
            </a>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="footer-left">
                <i class="fas fa-shield-alt"></i>
                <span>AHMII • PREMIUM</span>
            </div>
            <div class="footer-center">
                ⚡ RDX AHMII ⚡
            </div>
            <div class="footer-right">
                <i class="fas fa-heart"></i>
                <span>Ahmad RDX • 2026</span>
            </div>
        </div>

    </div>
</body>
</html>
