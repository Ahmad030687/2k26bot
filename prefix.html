<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDX BOT • PREFIX</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 30px;
        }
        .card {
            background: #111111;
            max-width: 700px;
            width: 100%;
            padding: 60px 50px;
            border-radius: 40px;
            border: 4px solid #ffd700;
            text-align: center;
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        h1 {
            color: #ffd700;
            font-size: 55px;
            font-weight: 900;
            margin-bottom: 5px;
            letter-spacing: 3px;
        }
        .subtitle {
            color: #ff8c00;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }
        .prefix-show {
            background: #1a1a1a;
            border: 3px solid #ffd700;
            border-radius: 25px;
            padding: 40px;
            margin-bottom: 35px;
        }
        .prefix-label {
            color: #ff8c00;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 5px;
            margin-bottom: 20px;
        }
        .prefix-big {
            font-size: 130px;
            font-weight: 900;
            color: #ffd700;
            line-height: 1;
            margin-bottom: 15px;
        }
        .prefix-example {
            color: #ffffff;
            font-size: 20px;
            font-weight: 600;
        }
        .info-row {
            display: flex;
            gap: 20px;
            margin-bottom: 35px;
        }
        .info-box {
            flex: 1;
            background: #1a1a1a;
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 25px 15px;
        }
        .info-emoji {
            font-size: 35px;
            margin-bottom: 10px;
        }
        .info-val {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 5px;
        }
        .info-lbl {
            color: #ff8c00;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 3px;
        }
        .btn-row {
            display: flex;
            gap: 20px;
        }
        .btn {
            flex: 1;
            padding: 18px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 800;
            text-decoration: none;
            letter-spacing: 3px;
            border: 3px solid #ffd700;
        }
        .btn-gold {
            background: #ffd700;
            color: #0a0a0a;
        }
        .btn-outline {
            background: transparent;
            color: #ffd700;
        }
        .footer-text {
            margin-top: 30px;
            color: #ff8c00;
            font-weight: bold;
            letter-spacing: 2px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">⚡</div>
        <h1>RDX BOT</h1>
        <div class="subtitle">PREFIX SYSTEM</div>
        
        <div class="prefix-show">
            <div class="prefix-label">✦ CURRENT PREFIX ✦</div>
            <div class="prefix-big">.</div>
            <div class="prefix-example">
                ⭐ .help • .menu • .info ⭐
            </div>
        </div>
        
        <div class="info-row">
            <div class="info-box">
                <div class="info-emoji">👑</div>
                <div class="info-val">Ahmad RDX</div>
                <div class="info-lbl">OWNER</div>
            </div>
            <div class="info-box">
                <div class="info-emoji">📦</div>
                <div class="info-val">3.0.0</div>
                <div class="info-lbl">VERSION</div>
            </div>
            <div class="info-box">
                <div class="info-emoji">☁️</div>
                <div class="info-val">Katabump</div>
                <div class="info-lbl">HOST</div>
            </div>
            <div class="info-box">
                <div class="info-emoji">🟢</div>
                <div class="info-val" style="color:#00ff88;">Online</div>
                <div class="info-lbl">STATUS</div>
            </div>
        </div>
        
        <div class="btn-row">
            <a href="/" class="btn btn-gold">📊 DASHBOARD</a>
            <a href="/api/status" class="btn btn-outline">🔌 API</a>
        </div>
        
        <div class="footer-text">
            ❤️ Powered by Ahmad RDX • 2026 ❤️
        </div>
    </div>
</body>
</html>
